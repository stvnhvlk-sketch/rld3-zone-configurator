# Serves the configurator at the ingress root. The app lives at /ui/index.html
# and imports ../src/*, so /www holds ui/ and src/ as siblings plus a root
# index.html that meta-refreshes (relatively) into ui/. No server-issued
# Location redirects: an absolute "/ui/" header would drop the ingress token,
# so the redirect is done client-side with a relative URL instead.
server {
    listen 8099 default_server;
    listen [::]:8099 default_server;

    root /www;
    index index.html;

    # If we ever do emit a redirect, keep it host-relative (defensive).
    absolute_redirect off;

    # No cache headers were set here at all, so staleness fell entirely to
    # browser heuristics. That produced a real outage on 2026-08-07: an add-on
    # update landed index.html and src/geometry.js together, but a browser
    # kept an old cached geometry.js alongside the new index.html — a
    # SyntaxError on the mismatched import ("does not provide an export named
    # isTargetOutsideRoom") with no visible error to the user, because the
    # failure is inside an ingress iframe the outer page's hard-reload does
    # not force-bypass. The fix that unblocked it was "Empty Cache and Hard
    # Reload" from DevTools — not something to rely on an operator knowing.
    #
    # no-cache (not no-store): still cacheable, but forces revalidation via
    # If-Modified-Since/If-None-Match on every load, so a changed file is
    # never served stale. Cheap — a 304 costs one round trip, not a re-fetch —
    # and correct: this update ships too rarely for the browser's heuristic
    # caching to be worth the risk of serving mismatched module versions.
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
